<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>test</title></head><body>
<div id="p"></div>
<script>
// Uso: /test/?v=ID  -> window.RES = 'OK' | 'ERR<code>' | 'TIMEOUT' ; anche document.title
const v=new URLSearchParams(location.search).get('v');window.RES='WAIT';
function done(r){window.RES=r;document.title=r}
window.onYouTubeIframeAPIReady=()=>{const p=new YT.Player('p',{videoId:v,host:'https://www.youtube-nocookie.com',width:480,height:270,playerVars:{autoplay:1,mute:1,playsinline:1},
events:{onReady:e=>{e.target.mute();e.target.playVideo()},onStateChange:e=>{if(e.data===1){done('OK');e.target.pauseVideo()}},onError:e=>done('ERR'+e.data)}});setTimeout(()=>{if(window.RES==='WAIT')done('TIMEOUT')},15000)};
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
</script></body></html>
